name: Flutter Build and Upload

on:
  push:
    branches: ["main", "publish"]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["main", "publish"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -qO /tmp/android-cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14033849"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter Android SDK path
        run: flutter config --android-sdk "$ANDROID_SDK_ROOT"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android artifact
        if: github.event_name != 'pull_request'
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-android-apk
          filename: pcalc-express-android-apk
          version: ${{ steps.version.outputs.semver }}
          path: build/app/outputs/flutter-apk/app-release.apk
          append-max-detail-suffix: true
          retention-days: 7

  linux:
    name: Linux bundle
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev llvm-dev libclang-22-dev llvm-22-dev cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev lld git unzip xz-utils zip libglu1-mesa \
            libsecret-1-dev libssl-dev

      - name: Select matching LLVM and Clang CMake packages
        shell: bash
        run: |
          set -euo pipefail
          llvm_dir="$(llvm-config --cmakedir)"
          clang_dir="${llvm_dir%/llvm}/clang"
          test -f "$llvm_dir/LLVMConfig.cmake"
          test -f "$clang_dir/ClangConfig.cmake"
          echo "LLVM_DIR=$llvm_dir" >> "$GITHUB_ENV"
          echo "Clang_DIR=$clang_dir" >> "$GITHUB_ENV"
          echo "Using LLVM_DIR=$llvm_dir"
          echo "Using Clang_DIR=$clang_dir"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Upload Linux artifact
        if: github.event_name != 'pull_request'
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-linux-bundle
          filename: pcalc-express-linux-bundle
          version: ${{ steps.version.outputs.semver }}
          path: build/linux/x64/release/bundle/
          append-max-detail-suffix: true
          retention-days: 7

  linux_gtk4:
    name: Linux GTK4 (prebuilt custom Flutter)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      FLUTTER_GTK4_REPOSITORY: https://github.com/richyo-codes/flutter.git
      FLUTTER_GTK4_BRANCH: 3.48.0-gtk4.issue94804.20260911
      FLUTTER_GTK4_SHA: 280e8df0ab1f91a87078de00705b61b8d47d8719
      FLUTTER_PREBUILT_ENGINE_VERSION: 61dae0cb8f6752dae2404a6c142737f04df2592e
      FLUTTER_ENGINE_STORAGE_BASE_URL: https://pub-79a02b1963fb4da6b5e4e4816e8b7146.r2.dev
      FLUTTER_LINUX_GTK: gtk4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute before FVM changes the job-local .fvmrc.
      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Install Linux GTK4 build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev llvm-dev libclang-22-dev llvm-22-dev \
            cmake ninja-build pkg-config libgtk-4-dev liblzma-dev \
            libstdc++-12-dev lld curl git unzip xz-utils zip libglu1-mesa \
            libsecret-1-dev libssl-dev libmimalloc-dev

      - name: Set up Dart for FVM
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        shell: bash
        run: |
          dart pub global activate fvm 4.2.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Verify requested Flutter branch
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git ls-remote "$FLUTTER_GTK4_REPOSITORY" "refs/heads/$FLUTTER_GTK4_BRANCH" | awk '{print $1}')"
          test "$actual_sha" = "$FLUTTER_GTK4_SHA"

      - name: Register fork and install pinned Flutter GTK4 SDK
        shell: bash
        run: |
          set -euo pipefail
          fvm fork add richyo-codes "$FLUTTER_GTK4_REPOSITORY"
          FLUTTER_STORAGE_BASE_URL="$FLUTTER_ENGINE_STORAGE_BASE_URL" \
            fvm install "richyo-codes/$FLUTTER_GTK4_SHA" --setup --skip-pub-get
          fvm use "richyo-codes/$FLUTTER_GTK4_SHA" --force --skip-setup --skip-pub-get

      - name: Install and verify prebuilt Linux GTK4 engines
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .fvm/flutter_sdk rev-parse HEAD)" = "$FLUTTER_GTK4_SHA"
          test "$(cat .fvm/flutter_sdk/bin/cache/engine.stamp)" = "$FLUTTER_PREBUILT_ENGINE_VERSION"
          bash ./tool/install_gtk4_prebuilt_engine.sh .fvm/flutter_sdk
          fvm flutter config --enable-linux-desktop
          # R2 provides the custom engine artifacts. Flutter's normal storage
          # still supplies shared assets such as Material fonts.
          fvm flutter precache --linux
          engine=.fvm/flutter_sdk/bin/cache/artifacts/engine/linux-x64-release/libflutter_linux_gtk4.so
          if [[ ! -f "$engine" ]]; then
            echo "::error::Published engine $FLUTTER_PREBUILT_ENGINE_VERSION is missing libflutter_linux_gtk4.so. Republish the Linux archives with GTK4 included; the GTK3 engine is not a substitute."
            exit 1
          fi

      - name: Select GTK4 Linux runner
        run: bash ./tool/configure_linux_variant.sh gtk4

      - name: Install Flutter dependencies
        run: fvm flutter pub get

      - name: Build Linux GTK4 release
        run: fvm flutter build linux --release --linux-gtk=gtk4

      - name: Verify GTK4 linkage and include provenance
        shell: bash
        env:
          ARTIFACT_VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          bundle=build/linux-gtk4/x64/release/bundle
          test -f "$bundle/lib/libflutter_linux_gtk4.so"
          ldd "$bundle/pcalc_express" | tee "$RUNNER_TEMP/pcalc-gtk4-linkage.txt"
          grep -q 'libgtk-4.so' "$RUNNER_TEMP/pcalc-gtk4-linkage.txt"
          if grep -Eq 'libgtk-3.so|not found' "$RUNNER_TEMP/pcalc-gtk4-linkage.txt"; then
            echo "GTK4 bundle contains GTK3 or unresolved libraries." >&2
            exit 1
          fi
          cp LICENSE "$bundle/"
          printf 'App version: %s\nApp commit: %s\nFlutter source: %s\nFlutter branch: %s\nFlutter commit: %s\nEngine artifacts: %s\nStorage: %s\n' \
            "$ARTIFACT_VERSION" "$GITHUB_SHA" "$FLUTTER_GTK4_REPOSITORY" \
            "$FLUTTER_GTK4_BRANCH" "$FLUTTER_GTK4_SHA" \
            "$FLUTTER_PREBUILT_ENGINE_VERSION" "$FLUTTER_ENGINE_STORAGE_BASE_URL" \
            > "$bundle/BUILD_INFO.txt"

      - name: Upload Linux GTK4 artifact
        if: github.event_name != 'pull_request'
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-linux-x64-gtk4
          filename: pcalc-express-linux-x64-gtk4
          version: ${{ steps.version.outputs.semver }}
          path: build/linux-gtk4/x64/release/bundle/
          append-max-detail-suffix: true
          retention-days: 7

  windows:
    name: Windows bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-windows-bundle
          filename: pcalc-express-windows-bundle
          version: ${{ steps.version.outputs.semver }}
          path: build/windows/x64/runner/Release/
          append-max-detail-suffix: true
          retention-days: 7

  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Upload macOS artifact
        if: github.event_name != 'pull_request'
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-macos-app
          filename: pcalc-express-macos-app
          version: ${{ steps.version.outputs.semver }}
          path: build/macos/Build/Products/Release/pcalc_express.app/
          append-max-detail-suffix: true
          retention-days: 7

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Install Linux and Flatpak build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev llvm-dev libclang-22-dev llvm-22-dev cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev lld git unzip xz-utils zip libglu1-mesa \
            libsecret-1-dev libssl-dev \
            flatpak flatpak-builder dbus-user-session

      - name: Select matching LLVM and Clang CMake packages
        shell: bash
        run: |
          set -euo pipefail
          llvm_dir="$(llvm-config --cmakedir)"
          clang_dir="${llvm_dir%/llvm}/clang"
          test -f "$llvm_dir/LLVMConfig.cmake"
          test -f "$clang_dir/ClangConfig.cmake"
          echo "LLVM_DIR=$llvm_dir" >> "$GITHUB_ENV"
          echo "Clang_DIR=$clang_dir" >> "$GITHUB_ENV"
          echo "Using LLVM_DIR=$llvm_dir"
          echo "Using Clang_DIR=$clang_dir"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flatpak bundle
        run: bash ./tools/build_flatpak.sh --out-dir "$RUNNER_TEMP/pcalc-express-flatpak"

      - name: Upload Flatpak artifact
        if: github.event_name != 'pull_request'
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-flatpak
          filename: pcalc-express-flatpak
          version: ${{ steps.version.outputs.semver }}
          path: ${{ runner.temp }}/pcalc-express-flatpak/ca.richyoung.pcalcexpress.flatpak
          append-max-detail-suffix: true
          retention-days: 7

  web:
    name: Web WASM
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Web WASM release
        run: flutter build web --wasm --release --no-pub

      - name: Upload Web WASM artifact
        if: github.event_name != 'pull_request'
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: pcalc-express-web-wasm
          filename: pcalc-express-web-wasm
          version: ${{ steps.version.outputs.semver }}
          path: build/web/
          append-max-detail-suffix: true
          retention-days: 7
